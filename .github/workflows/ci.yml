name: CI — Lint, Test, Smoke

# One entry point for every quality check.
#
# Four workflows used to overlap: this one (master only, Node from .nvmrc) ran
# lint + tests + smoke + API validation, while `lint.yml` and `test.yml` (all
# branches, Node 20) ran the same lint and test suites again. A pull request
# against master therefore executed `npm run lint` three times and `npm test`
# three times, on two different runtimes.
#
# `ci-boost.yml` is gone: it echoed "✅ CI active — tests ran successfully" and
# "✅ Documentation verified" without running anything.
#
# Each suite now runs exactly once, on the runtime pinned by .nvmrc. Jobs keep
# separate names so a failure points at one suite.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Check Markdown lint
        run: npm run lint:md

  unit:
    name: Unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm test` already runs tests/orchestrator.budget.test.js, so the
      # separate `npm run test:budget` step that used to live here executed the
      # same file twice inside one job.
      - name: Run unit tests
        run: npm test

      - name: API validation tests
        run: npm run test:validation

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: API smoke check
        run: npm run smoke

  # ── Cross-OS offline coverage (Issue #176) ───────────────────────────────────
  # The jobs above run on Linux only, while the docs support Windows
  # contributors: file replacement, child processes, line endings and paths all
  # behave differently there. This job runs the *same* commands on both systems
  # (same `npm test`, not a duplicated list) so the two cannot drift apart, plus
  # a workspace copied into a path containing spaces.
  offline-cross-os:
    name: Offline suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Includes the temporary-file storage reload, the startup/shutdown checks
      # (which always clean up their child processes) and the offline quality set.
      - name: Offline suites
        run: npm test

      - name: API validation tests
        run: npm run test:validation

      - name: Run history schema suite
        run: node tests/run-history-schema.test.js

      - name: Workspace path containing spaces
        # Step-level env: the `runner` context is not available in a job-level
        # `env` block, which GitHub rejects as an invalid workflow file.
        env:
          CI_LOG_DIR: ${{ runner.temp }}/stellarmind-logs
        run: node tests/support/space-path-suite.mjs

      - name: Lint, formatting and markdown
        run: |
          npm run lint
          npm run format:check
          npm run lint:md

      - name: Diagnostics on failure
        if: failure()
        env:
          CI_LOG_DIR: ${{ runner.temp }}/stellarmind-logs
        run: node tests/support/print-diagnostics.mjs
