openapi: '3.0.3'
info:
  title: StellarMind API
  description: REST API for the StellarMind agent orchestration platform
  version: '1.0.0'
  contact:
    name: StellarMind Team
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
paths:
  /agents:
    get:
      summary: List all registered agents
      operationId: listAgents
      tags: [Agents]
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      summary: Register a new agent
      operationId: registerAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInput'
      responses:
        '201':
          description: Agent registered
        '400':
          description: Invalid input

  /agents/{agentId}:
    get:
      summary: Get agent details
      operationId: getAgent
      tags: [Agents]
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found

  /orchestration:
    post:
      summary: Start an orchestration run
      operationId: startOrchestration
      tags: [Orchestration]
      description: >
        Submit an orchestration task. By default the request blocks until the run completes
        (synchronous mode). To receive an immediate 202 Accepted response with a run handle, use one
        of the async triggers below.

        **Async triggers (any one is sufficient):** - Query parameter `?async=true` - Body field
        `"mode": "async"` - Header `Prefer: respond-async`

        **Idempotency:** Include an `Idempotency-Key` header (or `X-Idempotency-Key`) to prevent
        duplicate runs. If the same key is reused with different parameters, the server responds 409
        Conflict.
      parameters:
        - name: async
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          description: Set to "true" to receive an immediate 202 response
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
          description: Client-generated key to prevent duplicate submissions
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
          description: Set to "respond-async" to receive an immediate 202 response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationInput'
      responses:
        '200':
          description: Synchronous completion (default mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationResult'
        '202':
          description: Async mode — run accepted, work in progress
          headers:
            Location:
              description: URL to poll for run status
              schema:
                type: string
            Preference-Applied:
              description: Echoed when the Prefer header was used
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400':
          description: Validation error (missing/invalid task, budget, mode, or idempotency key)
        '409':
          description: Idempotency key conflict (same key, different parameters)

  /orchestration/preview:
    post:
      summary: Preview an orchestration plan and quote work before execution
      operationId: previewOrchestration
      tags: [Orchestration]
      description: >
        Generates and validates an orchestration plan, returning validated steps, per-step quotes,
        total quote, expiry timestamp, and any planner-provider usage. Makes zero premium agent
        calls or settlement attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationInput'
      responses:
        '200':
          description: Plan preview with quotes and expiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId:
                    type: string
                  task:
                    type: string
                  budget:
                    type: number
                  plan:
                    type: string
                  steps:
                    type: array
                    items:
                      type: object
                  totalQuote:
                    type: string
                  expiresAt:
                    type: string
                  usage:
                    type: object
        '400':
          description: Validation error

  /orchestration/execute:
    post:
      summary: Execute a previously previewed orchestration plan
      operationId: executeOrchestrationPlan
      tags: [Orchestration]
      description: >
        Executes a stored plan by planId, validating the plan and current pricing against the
        accepted quote. Returns QUOTE_EXPIRED or QUOTE_CHANGED error if expired or if pricing
        changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
                  description: Plan identifier returned from /orchestration/preview
                mode:
                  type: string
                  enum: [sync, async]
                  default: sync
                idempotencyKey:
                  type: string
      responses:
        '200':
          description: Orchestration execution completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationResult'
        '400':
          description:
            Quote expired (QUOTE_EXPIRED), price changed (QUOTE_CHANGED), or validation error
        '404':
          description: Plan not found (PLAN_NOT_FOUND)

  /orchestration/{runId}/status:
    get:
      summary: Get orchestration run status
      operationId: getOrchestrationStatus
      tags: [Orchestration]
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationStatus'

  /runs/{runId}:
    get:
      summary: Get run detail
      operationId: getRunDetail
      tags: [Orchestration]
      description: >
        Retrieve the full detail of a run, including its current status, output (when completed),
        and error information (when failed). This is the endpoint referred to by the Location header
        in 202 responses.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          description: Run not found

  /runs:
    get:
      summary: List runs (cursor-paginated summaries)
      operationId: listRuns
      tags: [Orchestration]
      description: |
        Returns lightweight run **summaries**, newest first, one page at a time. Events, outputs,
        plans and payment proofs are not included; fetch them with `GET /runs/{runId}` (each item
        carries a `runUrl`).

        **Ordering.** Runs are ordered by `createdAt` descending, with `id` descending as the
        tie-breaker, so runs created in the same millisecond still have one fixed order.

        **Pagination.** Pass the previous response's `nextCursor` as `cursor` to get the next page.
        A cursor marks a position (the last run returned), not an offset, so a run created while you
        are paging is newer than the cursor and can never push an older run onto a second page:
        no run is returned twice. `nextCursor` is `null` (and `hasMore` is `false`) on the last
        page. Treat cursors as opaque; they are valid across server restarts.

        **Filters** (`status`, `createdFrom`, `createdTo`) combine with AND and with pagination.
        A cursor is bound to the filters it was issued for: reusing it with different filters is
        rejected with `CURSOR_FILTER_MISMATCH`; omit the cursor to restart. `limit` may change
        between pages.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Values above the maximum are clamped; the applied value is echoed.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque `nextCursor` value from a previous response.
          schema:
            type: string
            maxLength: 512
        - name: status
          in: query
          required: false
          description: >
            Only runs in these statuses. Repeat the parameter or comma-separate values
            (`status=failed,interrupted`); values are matched case-sensitively.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [running, completed, failed, interrupted]
        - name: createdFrom
          in: query
          required: false
          description: >
            Inclusive lower bound on `createdAt`. A UTC date (`2026-10-01`, meaning the start of
            that day) or an ISO 8601 date-time with a `Z` or `±hh:mm` offset (an exact instant).
            Date-times without an offset are rejected.
          schema:
            type: string
            example: '2026-10-01'
        - name: createdTo
          in: query
          required: false
          description: >
            Inclusive upper bound on `createdAt`. A UTC date (`2026-10-31`, meaning through
            23:59:59.999 of that day) or an ISO 8601 date-time with a `Z` or `±hh:mm` offset. Must
            not be earlier than `createdFrom`.
          schema:
            type: string
            example: '2026-10-31T23:59:59Z'
      responses:
        '200':
          description: One page of run summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          description: >
            Invalid query parameters (cursor, limit, status or date values). The body lists every
            problem in `details`, each with a machine-readable `code`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                code: INVALID_INPUT
                message: Invalid run list query parameters
                requestId: 7b51851b-c464-4eba-9f03-6baca9d900b4
                details:
                  - field: status
                    code: INVALID_STATUS
                    reason:
                      'Unknown status. Expected one or more of: running, completed, failed,
                      interrupted'
                    received: done

  /budget:
    get:
      summary: Get budget information
      operationId: getBudget
      tags: [Budget]
      responses:
        '200':
          description: Budget details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'

  /wallet:
    get:
      summary: Get wallet status
      operationId: getWallet
      tags: [Wallet]
      responses:
        '200':
          description: Wallet details

  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [System]
      responses:
        '200':
          description: System healthy

components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [active, inactive, error]
        createdAt:
          type: string
          format: date-time

    AgentInput:
      type: object
      required: [name, provider, model]
      properties:
        name:
          type: string
        provider:
          type: string
        model:
          type: string
        config:
          type: object

    OrchestrationInput:
      type: object
      required: [task]
      properties:
        task:
          type: string
          description: The task description for the orchestrator to plan and execute
        budget:
          type: number
          description: Maximum USDC budget for this orchestration run
        mode:
          type: string
          enum: [sync, async]
          default: sync
          description: Submission mode. "async" returns 202 immediately.
        idempotencyKey:
          type: string
          maxLength: 256
          description: >
            Optional idempotency key (alternative to the Idempotency-Key header). Prevents duplicate
            runs when the same key is used.

    OrchestrationStatus:
      type: object
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        progress:
          type: number
        result:
          type: object

    OrchestrationResult:
      type: object
      properties:
        runId:
          type: string
        task:
          type: string
        plan:
          type: object
        results:
          type: array
          items:
            type: object
        totalPaid:
          type: string
        totalCost:
          type: string
        elapsed:
          type: string

    RunAccepted:
      type: object
      description: Returned with HTTP 202 when async mode is used
      properties:
        runId:
          type: string
          description: Unique run identifier
        status:
          type: string
          enum: [running]
        url:
          type: string
          description: URL to poll for run status and results
        runUrl:
          type: string
          description: Alias for url (backward compatibility)
        task:
          type: string
        budget:
          type: number
        createdAt:
          type: string
          format: date-time
        mode:
          type: string
          enum: [async]

    RunSummary:
      type: object
      description: >
        Lightweight list item. Unbounded fields (events, output, plan, txProofs, usage) are omitted;
        use `GET /runs/{runId}` for the full record.
      properties:
        id:
          type: string
        runId:
          type: string
        task:
          type: string
          nullable: true
        budget:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
        status:
          type: string
          enum: [running, completed, failed, interrupted]
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        outputAvailable:
          type: boolean
          description:
            true only when the final output has been persisted and can be read from the detail
            endpoint
        error:
          type: object
          nullable: true
          description: Failure code and message (message truncated to 500 characters)
          properties:
            code:
              type: string
              nullable: true
            message:
              type: string
              nullable: true
        interruptedAt:
          type: string
          format: date-time
          nullable: true
        interruptedReason:
          type: string
          nullable: true
          description: Machine-readable reason for an `interrupted` run (e.g. `server_restart`)
        totals:
          type: object
          description:
            Settlement totals copied from the run summary; fields are null when not recorded
          properties:
            totalSpent:
              nullable: true
            quotedTotal:
              nullable: true
            settledSummary:
              nullable: true
            txCount:
              nullable: true
            elapsed:
              nullable: true
        eventCount:
          type: integer
          description:
            Number of audit events recorded for the run (events themselves are in the detail record)
        runUrl:
          type: string
          description: Path of the full record, `/api/runs/{id}`

    RunList:
      type: object
      properties:
        storage:
          type: string
        file:
          type: string
          nullable: true
        count:
          type: integer
          description: Number of runs in this page
        limit:
          type: integer
          description: Page size that was applied
        order:
          type: string
          example: createdAt:desc,id:desc
        filters:
          type: object
          description: The filters that were applied, with date bounds resolved to instants
          properties:
            status:
              type: array
              items:
                type: string
            createdFrom:
              type: string
              format: date-time
              nullable: true
            createdTo:
              type: string
              format: date-time
              nullable: true
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page; null on the last page
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'

    ValidationError:
      type: object
      properties:
        code:
          type: string
          example: INVALID_INPUT
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
                enum:
                  - INVALID_CURSOR
                  - CURSOR_FILTER_MISMATCH
                  - INVALID_LIMIT
                  - INVALID_STATUS
                  - INVALID_DATE
                  - INVALID_DATE_RANGE
                  - DUPLICATE_PARAMETER
                  - INVALID_VALUE
              reason:
                type: string
              received:
                type: string

    RunDetail:
      type: object
      description: |
        Full run record including status, output, and error information.
        - running: `output` is `null` and `outputAvailable` is `false`
        - failed: `output` is `null`, `outputAvailable` is `false`, and `error` holds the failure data
        - completed: `output` contains the persisted orchestration results and `outputAvailable` is `true`
        - legacy records without persisted output: `output` remains `null` and `outputAvailable` is `false`
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [running, completed, failed, interrupted]
        task:
          type: string
        budget:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        outputAvailable:
          type: boolean
          description: true only when the final output has been persisted and is safe to read
        output:
          type: array
          items:
            type: object
          nullable: true
          description:
            Persisted orchestration results. Null while running, after failures, or for legacy
            records without stored output.
        error:
          type: object
          nullable: true
          description: Error details (null unless run failed)
          properties:
            message:
              type: string
            code:
              type: string
        quotedTotal:
          type: string
          description:
            Quoted/reserved cost the budget guardrail admitted (USDC). Not a settled total.
        settledTotals:
          type: array
          description: |
            Settled amounts grouped per asset (asset, issuer, network). Amounts of
            different assets are never added together; there is no USDC/XLM
            conversion policy in this deployment.
          items:
            type: object
            properties:
              asset:
                type: string
              issuer:
                type: string
                nullable: true
              network:
                type: string
                nullable: true
              amount:
                type: string
              count:
                type: integer
              txCount:
                type: integer
        txProofs:
          type: array
          description: Settled transaction proofs, including the actual settled asset and amount.
          items:
            type: object
            properties:
              method:
                type: string
              txHash:
                type: string
                nullable: true
              explorerUrl:
                type: string
                nullable: true
              asset:
                type: string
                nullable: true
                description: Settled asset code (USDC for x402, XLM for the direct fallback)
              issuer:
                type: string
                nullable: true
              network:
                type: string
                nullable: true
              amount:
                type: string
                nullable: true
              quotedAmount:
                type: string
                nullable: true
        summary:
          type: object
          nullable: true
        events:
          type: array
          items:
            type: object

    Budget:
      type: object
      properties:
        total:
          type: number
        spent:
          type: number
        remaining:
          type: number
        currency:
          type: string

# Generated for Stellar Wave bounty #36

