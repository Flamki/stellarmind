openapi: '3.0.3'
info:
  title: StellarMind API
  description: REST API for the StellarMind AI agent marketplace with x402 micropayments on Stellar
  version: '1.0.0'
  contact:
    name: StellarMind Team
servers:
  - url: http://localhost:3001
    description: Local development server
paths:
  /healthz:
    get:
      summary: Liveness health check
      operationId: getHealthz
      tags: [System]
      responses:
        '200':
          description: Server process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                uptime: 842.31
                timestamp: '2026-07-30T12:00:00.000Z'

  /readyz:
    get:
      summary: Readiness check
      operationId: getReadyz
      tags: [System]
      responses:
        '200':
          description: All required components are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: One or more components are not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /api/status:
    get:
      summary: System status, network profile, and x402 pricing metadata
      operationId: getStatus
      tags: [System]
      responses:
        '200':
          description: System status and x402 configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                name: StellarMind
                version: '1.0.0'
                description: AI Agent Marketplace with x402 Micropayments on Stellar
                status: online
                network: stellar:testnet
                facilitator: https://www.x402.org/facilitator
                agents: 4
                x402:
                  enabled: true
                  middleware: '@x402/express (paymentMiddlewareFromConfig)'
                  client: '@x402/fetch (wrapFetchWithPayment + ExactStellarScheme)'
                  premiumEndpoints:
                    - GET /api/premium/research ($0.01)
                    - GET /api/premium/summarize ($0.01)
                    - GET /api/premium/analyze ($0.05)
                    - GET /api/premium/code ($0.03)
                  pricing:
                    - endpoint: GET /api/premium/research
                      price: $0.01
                      agent: research-bot
                      description: Research Agent - Web research and information gathering
                      emoji: 🔬
                  flow:
                    402 → wrapFetchWithPayment signs USDC tx → retry with X-PAYMENT → facilitator
                    settles on-chain → 200
                wallets:
                  server: GABCDEF1...
                  orchestrator: G2345678...
                  buyer: GA987654...
                claudeEnabled: true
                orchestrationQueue:
                  active: 0
                  queued: 0
                  maxConcurrent: 2
                  queueCapacity: 10
                  queueTimeoutMs: 30000
                  multiReplicaCoordination: false
                  note:
                    In-process admission queue bounds concurrency on this node; no cross-node
                    distributed coordination.
                runHistory:
                  storage: file
                  file: ./data/run-history.json
                  maxRuns: 200

  /api/agents:
    get:
      summary: List all registered agents
      operationId: listAgents
      tags: [Agents]
      responses:
        '200':
          description: Registered agent catalog
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/Agent'

  /api/agents/{id}:
    get:
      summary: Get agent details by ID
      operationId: getAgent
      tags: [Agents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agents/discover/{capability}:
    get:
      summary: Discover agents matching a capability keyword
      operationId: discoverAgents
      tags: [Agents]
      parameters:
        - name: capability
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'

  /api/premium/research:
    get:
      summary: Premium research agent endpoint (x402-protected)
      operationId: getPremiumResearch
      tags: [Premium]
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        '200':
          description: Research agent response after payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumResearchResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredResponse'

  /api/premium/summarize:
    get:
      summary: Premium summary agent endpoint (x402-protected)
      operationId: getPremiumSummarize
      tags: [Premium]
      parameters:
        - name: text
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 5000
      responses:
        '200':
          description: Summary agent response after payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumSummarizeResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredResponse'

  /api/premium/analyze:
    get:
      summary: Premium analysis agent endpoint (x402-protected)
      operationId: getPremiumAnalyze
      tags: [Premium]
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 500
      responses:
        '200':
          description: Analysis agent response after payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumAnalyzeResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredResponse'

  /api/premium/code:
    get:
      summary: Premium code agent endpoint (x402-protected)
      operationId: getPremiumCode
      tags: [Premium]
      parameters:
        - name: prompt
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2000
      responses:
        '200':
          description: Code agent response after payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumCodeResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredResponse'

  /api/orchestrate:
    post:
      summary: Start an orchestration run
      operationId: startOrchestration
      tags: [Orchestration]
      parameters:
        - name: async
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationInput'
      responses:
        '200':
          description: Synchronous orchestration completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationResult'
        '202':
          description: Async mode — run accepted
          headers:
            Location:
              description: URL to poll for run status
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Idempotency key conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission queue capacity exceeded or wait timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orchestrate/preview:
    post:
      summary: Preview an orchestration plan and quote work before execution
      operationId: previewOrchestration
      tags: [Orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationInput'
      responses:
        '200':
          description: Plan preview with quotes and expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationPreview'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/orchestrate/execute:
    post:
      summary: Execute a previously previewed orchestration plan
      operationId: executeOrchestrationPlan
      tags: [Orchestration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
                mode:
                  type: string
                  enum: [sync, async]
                  default: sync
                idempotencyKey:
                  type: string
      responses:
        '200':
          description: Orchestration execution completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationResult'
        '400':
          description: Quote expired, price changed, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orchestrate/queue:
    get:
      summary: Inspect orchestration admission queue state
      operationId: getOrchestrationQueue
      tags: [Orchestration]
      responses:
        '200':
          description: Admission queue state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueState'

  /api/runs:
    get:
      summary: List recent orchestration runs
      operationId: listRuns
      tags: [Orchestration]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListResponse'

  /api/runs/{id}:
    get:
      summary: Get run detail by ID
      operationId: getRunDetail
      tags: [Orchestration]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthStatus:
      type: object
      required: [status, uptime, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        uptime:
          type: number
        timestamp:
          type: string

    ReadinessStatus:
      type: object
      required: [status, ready, timestamp, components]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        ready:
          type: boolean
        timestamp:
          type: string
        components:
          type: object
          required: [app, anthropic, x402]
          properties:
            app:
              type: object
              required: [ready, description]
              properties:
                ready:
                  type: boolean
                description:
                  type: string
            anthropic:
              type: object
              required: [configured, ready, description]
              properties:
                configured:
                  type: boolean
                ready:
                  type: boolean
                description:
                  type: string
            x402:
              type: object
              required: [enabled, ready, description]
              properties:
                enabled:
                  type: boolean
                ready:
                  type: boolean
                description:
                  type: string

    PricingEntry:
      type: object
      required: [endpoint, price, agent, description, emoji]
      properties:
        endpoint:
          type: string
        price:
          type: string
        agent:
          type: string
        description:
          type: string
        emoji:
          type: string

    QueueState:
      type: object
      required:
        - active
        - queued
        - maxConcurrent
        - queueCapacity
        - queueTimeoutMs
        - multiReplicaCoordination
        - note
      properties:
        active:
          type: integer
        queued:
          type: integer
        maxConcurrent:
          type: integer
        queueCapacity:
          type: integer
        queueTimeoutMs:
          type: integer
        multiReplicaCoordination:
          type: boolean
        note:
          type: string
        retryAfterDefaultSec:
          type: integer

    SystemStatus:
      type: object
      required:
        - name
        - version
        - description
        - status
        - network
        - facilitator
        - agents
        - x402
        - wallets
        - claudeEnabled
        - orchestrationQueue
        - runHistory
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [online]
        network:
          type: string
        facilitator:
          type: string
        agents:
          type: integer
        x402:
          type: object
          required: [enabled, middleware, client, premiumEndpoints, pricing, flow]
          properties:
            enabled:
              type: boolean
            middleware:
              type: string
            client:
              type: string
            premiumEndpoints:
              type: array
              items:
                type: string
            pricing:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PricingEntry'
            flow:
              type: string
        wallets:
          type: object
          required: [server, orchestrator, buyer]
          properties:
            server:
              type: string
            orchestrator:
              type: string
            buyer:
              type: string
        claudeEnabled:
          type: boolean
        orchestrationQueue:
          $ref: '#/components/schemas/QueueState'
        runHistory:
          type: object
          required: [storage, file, maxRuns]
          properties:
            storage:
              type: string
            file:
              type: string
              nullable: true
            maxRuns:
              type: integer

    Agent:
      type: object
      required:
        - id
        - name
        - endpoint
        - price
        - currency
        - model
        - capability
        - description
        - status
      properties:
        id:
          type: string
        name:
          type: string
        endpoint:
          type: string
        price:
          type: string
        currency:
          type: string
        model:
          type: string
        capability:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [online, active, inactive, error]

    PremiumResearchResponse:
      type: object
      required: [agent, topic, result, model, cost, paidVia]
      properties:
        agent:
          type: string
          enum: [research-bot]
        topic:
          type: string
        result:
          type: string
        model:
          type: string
        cost:
          type: string
        paidVia:
          type: string
          enum: [x402]

    PremiumSummarizeResponse:
      type: object
      required: [agent, result, model, cost, paidVia]
      properties:
        agent:
          type: string
          enum: [summary-bot]
        result:
          type: string
        model:
          type: string
        cost:
          type: string
        paidVia:
          type: string
          enum: [x402]

    PremiumAnalyzeResponse:
      type: object
      required: [agent, topic, result, model, cost, paidVia]
      properties:
        agent:
          type: string
          enum: [analyst-bot]
        topic:
          type: string
        result:
          type: string
        model:
          type: string
        cost:
          type: string
        paidVia:
          type: string
          enum: [x402]

    PremiumCodeResponse:
      type: object
      required: [agent, prompt, result, model, cost, paidVia]
      properties:
        agent:
          type: string
          enum: [code-bot]
        prompt:
          type: string
        result:
          type: string
        model:
          type: string
        cost:
          type: string
        paidVia:
          type: string
          enum: [x402]

    PaymentRequiredResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        price:
          type: string
        asset:
          type: string
        network:
          type: string

    ValidationErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
        code:
          type: string
        received: {}

    ValidationErrorResponse:
      type: object
      required: [code, message, requestId, details]
      properties:
        code:
          type: string
          enum: [INVALID_INPUT, INVALID_API_KEY, INVALID_LIMIT, INVALID_DIRECTION, INVALID_CURSOR]
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
        stack:
          type: string

    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryAfter:
          type: integer
        state:
          type: object
        details:
          type: array
          items:
            type: object
        stack:
          type: string

    OrchestrationInput:
      type: object
      required: [task]
      properties:
        task:
          type: string
        budget:
          type: number
        mode:
          type: string
          enum: [sync, async]
          default: sync
        idempotencyKey:
          type: string
          maxLength: 256

    SettledAssetTotal:
      type: object
      required: [asset, amount, count, txCount]
      properties:
        asset:
          type: string
        issuer:
          type: string
          nullable: true
        network:
          type: string
          nullable: true
        amount:
          type: string
        amountExact:
          type: object
        count:
          type: integer
        txCount:
          type: integer

    OrchestrationStepResult:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: string
        stepId:
          type: string
        agentName:
          type: string
        model:
          type: string
        input:
          type: string
        output:
          type: string
        skipped:
          type: boolean
        reason:
          type: string
        cost:
          type: string
        currency:
          type: string
        quotedAmount:
          type: string
        quotedAsset:
          type: string
        settledAmount:
          type: string
          nullable: true
        settledAsset:
          type: string
          nullable: true
        settledIssuer:
          type: string
          nullable: true
        settledNetwork:
          type: string
          nullable: true
        settlement:
          type: object
          nullable: true
        paidVia:
          type: string
        paymentSuccess:
          type: boolean
        txHash:
          type: string
          nullable: true
        explorerUrl:
          type: string
          nullable: true

    OrchestrationResult:
      type: object
      required:
        - runId
        - task
        - plan
        - budget
        - totalSpent
        - quotedTotal
        - settledTotals
        - settledSummary
        - budgetExhausted
        - agentsUsed
        - agentsSkipped
        - paymentProtocol
        - results
        - payments
        - txCount
        - elapsed
      properties:
        runId:
          type: string
        task:
          type: string
        plan:
          type: string
        budget:
          type: number
        budgetExact:
          type: object
        totalSpent:
          type: string
        totalSpentExact:
          type: object
        quotedTotal:
          type: string
        quotedTotalExact:
          type: object
        settledTotals:
          type: array
          items:
            $ref: '#/components/schemas/SettledAssetTotal'
        settledSummary:
          type: string
        settledPaymentCount:
          type: integer
        settlementConversionPolicy:
          type: object
          required: [applied, reason]
          properties:
            applied:
              type: boolean
            reason:
              type: string
        budgetExhausted:
          type: boolean
        agentsUsed:
          type: integer
        agentsSkipped:
          type: integer
        paymentProtocol:
          type: string
        x402PaymentCount:
          type: integer
        xlmFallbackCount:
          type: integer
        unpaidCount:
          type: integer
        x402Configured:
          type: boolean
        x402WalletReady:
          type: boolean
          nullable: true
        x402WalletHint:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrchestrationStepResult'
        payments:
          type: array
          items:
            type: object
        txCount:
          type: integer
        elapsed:
          type: string
        usage:
          type: object
        paymentAttempts:
          type: array
          items:
            type: object
        paymentAttemptSummary:
          type: object
        pendingPaymentCount:
          type: integer

    OrchestrationPreview:
      type: object
      required: [planId, task, budget, plan, steps, totalQuote, expiresAt, usage]
      properties:
        planId:
          type: string
        task:
          type: string
        budget:
          type: number
        budgetExact:
          type: object
        plan:
          type: string
        steps:
          type: array
          items:
            type: object
            required: [agentId, agentName, model, input, quote, currency]
            properties:
              agentId:
                type: string
              agentName:
                type: string
              model:
                type: string
              input:
                type: string
              quote:
                type: string
              quoteExact:
                type: object
              currency:
                type: string
        totalQuote:
          type: string
        totalQuoteExact:
          type: object
        expiresAt:
          type: string
        usage:
          type: object

    RunAccepted:
      type: object
      required: [runId, status, url, runUrl, task, budget, createdAt, mode]
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [running, completed, failed, interrupted]
        url:
          type: string
        runUrl:
          type: string
        task:
          type: string
        budget:
          type: number
        createdAt:
          type: string
        mode:
          type: string
          enum: [async]
        idempotent:
          type: boolean

    RunDetail:
      type: object
      required:
        - id
        - runId
        - status
        - task
        - budget
        - createdAt
        - updatedAt
        - outputAvailable
        - results
        - txProofs
        - events
      properties:
        id:
          type: string
        runId:
          type: string
        status:
          type: string
          enum: [running, completed, failed, interrupted]
        task:
          type: string
        budget:
          type: number
        source:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        completedAt:
          type: string
          nullable: true
        interruptedAt:
          type: string
          nullable: true
        interruptedReason:
          type: string
          nullable: true
        plan:
          type: string
          nullable: true
        outputAvailable:
          type: boolean
        output:
          type: array
          items:
            type: object
          nullable: true
        results:
          type: array
          items:
            type: object
        error:
          type: object
          nullable: true
          properties:
            message:
              type: string
            code:
              type: string
        summary:
          type: object
          nullable: true
        usage:
          type: object
          nullable: true
        txProofs:
          type: array
          items:
            type: object
        events:
          type: array
          items:
            type: object

    RunListResponse:
