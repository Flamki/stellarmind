version: '3.8'

services:
  stellarmind:
    build: .
    container_name: stellarmind
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:3001/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./logs:/app/logs
      # Named volume rather than a bind mount, deliberately: Docker seeds a
      # named volume from the image's /app/data, ownership included, so the
      # non-root user can write to it. A host bind mount here would be created
      # root-owned and bring the EACCES back.
      - stellarmind_data:/app/data
    networks:
      - stellarmind

  # Optional: Redis for session/rate-limiting
  redis:
    image: redis:7-alpine
    container_name: stellarmind-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - stellarmind
    profiles:
      - full

networks:
  stellarmind:
    driver: bridge

volumes:
  redis_data:
  # Run history (/app/data/run-history.json) survives container recreation.
  # Backup:  docker exec stellarmind node src/run-history-backup.js backup /app/data/run-history.backup.json
  # Restore: docker exec stellarmind node src/run-history-backup.js restore /app/data/run-history.backup.json /app/data/run-history.json
  stellarmind_data:

